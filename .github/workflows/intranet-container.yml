name: Intranet container validation

on:
  push:
    branches:
      - codex/intranet-containerization
  workflow_dispatch:
  pull_request:
    paths:
      - "MemoryCore/**"
      - "MemoryKnowledge/**"
      - "MemoryPanel/**"
      - "MemoryProxy/**"
      - "deploy/intranet/**"
      - ".github/workflows/intranet-container.yml"

jobs:
  compose-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          sh -n deploy/intranet/scripts/bootstrap-admin.sh
          sh -n deploy/intranet/scripts/verify.sh
          sh -n deploy/intranet/scripts/verify-debian10-uos-runtime.sh
      - name: Render Compose configuration
        run: |
          cp deploy/intranet/.env.example deploy/intranet/.env
          docker compose --env-file deploy/intranet/.env \
            -f deploy/intranet/docker-compose.yml config >/tmp/tdai-compose.yaml
          test "$(grep -c 'memory-core:' /tmp/tdai-compose.yaml)" -ge 1
          test "$(grep -c 'memory-proxy:' /tmp/tdai-compose.yaml)" -ge 1
      - name: Check tracked files and Dockerfile references
        run: |
          git diff --check
          test -f MemoryKnowledge/docker/entrypoint.sh
          test -f MemoryKnowledge/docker/smoke-test.sh
          test -f MemoryPanel/docker/local/entrypoint.sh

  container-build:
    runs-on: ubuntu-latest
    needs: compose-static
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the four intranet images
        run: |
          cp deploy/intranet/.env.example deploy/intranet/.env
          docker compose --env-file deploy/intranet/.env \
            -f deploy/intranet/docker-compose.yml build --pull=false
      - name: Run image-level type checks
        run: |
          docker run --rm --entrypoint /bin/sh tdai-memory-proxy:intranet \
            -lc 'npx tsc --noEmit'
          docker run --rm --entrypoint /bin/sh tdai-memory-panel:intranet \
            -lc 'npm run typecheck'
      - name: Debian 10 and UOS-compatible startup smoke
        env:
          PULL_DEBIAN_IMAGE: "1"
          RUNTIME_UID: "10001"
          RUNTIME_GID: "10001"
        run: |
          sh deploy/intranet/scripts/verify-debian10-uos-runtime.sh
